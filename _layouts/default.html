<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#172d38">
    <title>{% if page.title and page.title != '首页' %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main">跳到正文</a>
    <div class="site-shell">
      <header class="site-header">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="depictlightning 首页">depict<span class="brand-mark">✦</span>lightning</a>
        <nav class="site-nav" aria-label="主导航">
          <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>首页</a>
          <a href="{{ '/research/' | relative_url }}"{% if page.url == '/research/' %} aria-current="page"{% endif %}>研究笔记</a>
          <a href="{{ '/essays/' | relative_url }}"{% if page.url == '/essays/' %} aria-current="page"{% endif %}>随笔</a>
        </nav>
      </header>

      <main id="main">{{ content }}</main>

      <footer class="site-footer">
        <p>永远充满好奇心。<span aria-hidden="true"> ✦ </span>持续记录，继续追问。</p>
        <a href="https://github.com/depictlightning">GitHub ↗</a>
      </footer>
    </div>
  </body>
</html>
